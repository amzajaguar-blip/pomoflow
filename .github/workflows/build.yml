name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Concedi permessi a gradlew
        run: chmod +x gradlew

      - name: Build APK Release (unsigned)
        run: |
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.daemon=false"
          ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace
        timeout-minutes: 25

      - name: Rinomina APK
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk pomoflow-unsigned.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk pomoflow-unsigned.apk 2>/dev/null || \
          echo "APK non trovato, controllo struttura..."
          find app/build -name "*.apk" 2>/dev/null

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomoflow-apk
          path: pomoflow-unsigned.apk
          if-no-files-found: warn
